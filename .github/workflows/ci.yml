# LionOrganizer — continuous integration.
# Runs on pushes to main and on pull requests, and is reused by release.yml before anything is published.
# Kept light on purpose:
#  - changes that only touch documentation do not run it;
#  - a newer push to the same branch cancels the run still going for the older one;
#  - a push to main whose commit is already tagged vX.Y.Z (git push origin main vX.Y.Z) skips the tests here,
#    because the Release workflow runs exactly the same jobs for that commit;
#  - every job has a time limit, so nothing can hang for hours.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitattributes']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitattributes']
  workflow_call:

permissions:
  contents: read

concurrency:
  # inside release.yml the ref is the tag, so this never waits on the release itself
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  gate:
    name: Already being released?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      tagged: ${{ steps.check.outputs.tagged }}
    steps:
      - id: check
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          sleep 20 # the tag usually arrives in the same push; give it a moment
          if git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/v*' | grep -q "^$SHA"; then
            echo "Commit $SHA has a version tag: the Release workflow tests it, nothing to do here."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint installers
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh
        run: shellcheck -s bash -S warning scripts/install.sh
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns,PSReviewUnusedParameter
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: install.ps1 is ASCII (Windows PowerShell 5.1 reads BOM-less files as ANSI)
        run: "! LC_ALL=C grep -nP '[^\\x00-\\x7F]' scripts/install.ps1 scripts/install.cmd"

  test:
    name: Tests
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Allow Chromium's sandbox on Ubuntu 24.04 runners
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # xvfb comes with the runner image; install it only if missing, never waiting on apt for long
          if ! command -v xvfb-run >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo -E timeout 120 apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 </dev/null
            sudo -E timeout 180 apt-get install -y -qq --no-install-recommends xvfb </dev/null >/dev/null
          fi
          xvfb-run --help >/dev/null
      - name: Translations
        run: npm run test:i18n
      - name: End-to-end (light and dark)
        timeout-minutes: 10
        run: |
          for theme in light dark; do
            E2E_FOLDER="$RUNNER_TEMP/e2e-$theme" E2E_OUT="$RUNNER_TEMP/e2e-out" E2E_THEME="$theme" \
              xvfb-run -a npx electron tools/e2e.js
          done
      - name: Release assets are reproducible
        run: |
          node tools/make-release.js --out "$RUNNER_TEMP/r1"
          node tools/make-release.js --out "$RUNNER_TEMP/r2"
          diff "$RUNNER_TEMP/r1/SHA256SUMS" "$RUNNER_TEMP/r2/SHA256SUMS"
      - name: Installer end to end (local release, per-user install)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/srv/releases/latest/download" "$RUNNER_TEMP/srv/releases/download/v$v"
          cp "$RUNNER_TEMP"/r1/* "$RUNNER_TEMP/srv/releases/latest/download/"
          cp "$RUNNER_TEMP"/r1/* "$RUNNER_TEMP/srv/releases/download/v$v/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/srv" >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          export LIONORGANIZER_ALLOW_INSECURE_FOR_TESTS=1 LIONORGANIZER_RELEASES_URL=http://127.0.0.1:8765/releases
          bash scripts/install.sh --user --yes --no-deps
          test -x "$HOME/.local/share/lionorganizer/lionorganizer"
          test -f "$HOME/.local/share/lionorganizer/resources/app/package.json"
          test -f "$HOME/.local/share/applications/lionorganizer.desktop"
          app="$HOME/.local/share/lionorganizer/lionorganizer"
          xvfb-run -a "$HOME/.local/bin/lionorganizer" --disable-gpu >/dev/null 2>&1 &
          sleep 10
          pgrep -f "$app" >/dev/null || { echo "the installed app did not start"; exit 1; }
          pkill -f "$app" || true
          sleep 2
          printf 'x' >> "$RUNNER_TEMP/srv/releases/download/v$v/lionorganizer-$v.tar.gz"
          if bash scripts/install.sh --user --yes --no-deps --force; then echo "tampered bundle was accepted"; exit 1; fi
          bash scripts/install.sh --uninstall --purge --yes
          test ! -e "$HOME/.local/share/lionorganizer"

  windows:
    name: Windows installers
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.tagged != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Release assets
        shell: pwsh
        run: node tools/make-release.js --out "$env:RUNNER_TEMP\r1"

      - name: Inno Setup 6.7.4 (pinned by SHA-256)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Build the graphical installer
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          ISCC.exe /Q "/DAppVersion=$v" installer\lionorganizer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist-installer\LionOrganizer-Setup.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: dist-installer/LionOrganizer-Setup.exe
          if-no-files-found: error

      - name: Installers end to end (local release, real Electron download)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = node -p "require('./package.json').version"
          $srv = Join-Path $env:RUNNER_TEMP 'srv'
          $rel = Join-Path $srv 'releases'
          New-Item -ItemType Directory -Force -Path "$rel\latest\download", "$rel\download\v$v" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\r1\*" "$rel\latest\download\"
          Copy-Item "$env:RUNNER_TEMP\r1\*" "$rel\download\v$v\"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $srv -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:LIONORGANIZER_ALLOW_INSECURE_FOR_TESTS = '1'
          $env:LIONORGANIZER_RELEASES_URL = 'http://127.0.0.1:8765/releases'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\LionOrganizer'
          $innoKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3DB12C40-AF27-4CC9-93C6-10C9EB0AA79B}_is1'
          function Assert-True($ok, [string] $msg) { if (-not $ok) { throw "FAILED: $msg" }; Write-Host "OK   $msg" }
          function Get-AppProcess { @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith("$app\", [StringComparison]::OrdinalIgnoreCase) }) }
          function Test-AppStarts {
            $p = Start-Process (Join-Path $app 'LionOrganizer.exe') -PassThru
            Start-Sleep -Seconds 12
            $alive = -not $p.HasExited
            # LionOrganizer.exe and Electron's helper processes
            Get-AppProcess | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            return $alive
          }
          function Wait-Gone([string] $path) { for ($i = 0; $i -lt 120 -and (Test-Path $path); $i++) { Start-Sleep -Seconds 1 }; -not (Test-Path $path) }
          function Invoke-Setup([string] $exe, [string[]] $extra) {
            $log = Join-Path $env:RUNNER_TEMP ("setup-" + [Guid]::NewGuid().ToString('N') + '.log')
            $p = Start-Process $exe -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log") + $extra) -Wait -PassThru
            # Write-Host, not output: anything written to the pipeline here would become part of the return value
            Get-Content $log -Tail 15 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   | $_" }
            return $p.ExitCode
          }
          try {
            # 1. the PowerShell script, under Windows PowerShell 5.1 (what users have)
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Yes
            Assert-True ($LASTEXITCODE -eq 0) 'install.ps1 finished'
            Assert-True ((Get-Content "$app\resources\app\package.json" -Raw | ConvertFrom-Json).version -eq $v) "install.ps1 installed version $v"
            Assert-True (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LionOrganizer') 'install.ps1 entry in Settings > Apps'
            Assert-True (Test-AppStarts) 'the app installed by install.ps1 starts'
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$app\install.ps1" -Uninstall -Yes
            Assert-True (-not (Test-Path "$app\LionOrganizer.exe")) 'install.ps1 -Uninstall removed the app'

            # 2. the graphical installer, silent
            $code = Invoke-Setup 'dist-installer\LionOrganizer-Setup.exe' @()
            Assert-True ($code -eq 0) "LionOrganizer-Setup.exe finished (exit code $code)"
            Assert-True ((Get-Content "$app\resources\app\package.json" -Raw | ConvertFrom-Json).version -eq $v) "setup installed version $v"
            Assert-True ((Get-ItemProperty $innoKey).DisplayVersion -eq $v) 'setup entry in Settings > Apps shows the installed version'
            Assert-True (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\LionOrganizer.lnk") 'Start menu shortcut'
            Assert-True (Test-Path "$env:LOCALAPPDATA\LionOrganizer-Installer\LionOrganizer-Setup.exe") 'installer copy for updates'
            Assert-True (-not (Test-Path "$env:LOCALAPPDATA\LionOrganizer-Installer\staging")) 'temporary folder removed'
            Assert-True (Test-AppStarts) 'the app installed by the setup starts'

            # 3. update with the copy used by the "Update LionOrganizer" shortcut
            $code = Invoke-Setup "$env:LOCALAPPDATA\LionOrganizer-Installer\LionOrganizer-Setup.exe" @('/UPDATE')
            Assert-True ($code -eq 0) "update from the Start menu copy (exit code $code)"
            Assert-True ((Test-Path "$app\unins000.dat") -and -not (Test-Path "$app\unins001.exe")) 'the update kept the same uninstaller'

            # 4. a tampered release is refused and the installed version is kept
            Add-Content -Path "$rel\download\v$v\lionorganizer-$v.zip" -Value 'x'
            $code = Invoke-Setup 'dist-installer\LionOrganizer-Setup.exe' @()
            Assert-True ($code -ne 0) "tampered package refused (exit code $code)"
            Assert-True (Test-Path "$app\LionOrganizer.exe") 'the installed version was kept'

            # 5. uninstall, with the app open: the uninstaller must close it first
            Start-Process (Join-Path $app 'LionOrganizer.exe') | Out-Null
            Start-Sleep -Seconds 8
            Write-Host ("app processes before uninstalling: " + (Get-AppProcess).Count)
            $ulog = Join-Path $env:RUNNER_TEMP 'uninstall.log'
            # the uninstaller registered in Settings > Apps, as Windows runs it
            $uninstaller = (Get-ItemProperty $innoKey).UninstallString.Trim('"')
            Write-Host "uninstaller: $uninstaller"
            Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$ulog" -Wait
            $gone = Wait-Gone "$app\LionOrganizer.exe"
            if (-not $gone) {
              Write-Host '--- uninstall log'; Get-Content $ulog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   | $_" }
              Write-Host '--- files left'; Get-ChildItem $app -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $($_.Name)" }
              Write-Host '--- processes from the app folder'; Get-AppProcess | ForEach-Object { Write-Host "   $($_.Id) $($_.Path)" }
            }
            Assert-True $gone 'uninstaller closed the app and removed it'
            Assert-True (Wait-Gone $innoKey) 'uninstaller removed the entry in Settings > Apps'
            Assert-True (Wait-Gone "$env:LOCALAPPDATA\LionOrganizer-Installer") 'uninstaller removed the installer copy'
          } finally {
            Stop-Process $server -ErrorAction SilentlyContinue
          }
