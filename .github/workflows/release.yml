# LionOrganizer — publishes a GitHub release when a version tag (vX.Y.Z) is pushed.
#
# The release holds only small files (a few hundred KB): the app source bundle, a manifest, the
# installers and SHA256SUMS. The installers download the Electron runtime from Electron's own
# GitHub releases and verify it against Electron's published checksums.
# Every asset also gets a signed build-provenance attestation (Sigstore), which users can check with
#   gh attestation verify <file> --repo danielcarli/lionorganizer
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # sign the provenance attestation (Sigstore, keyless)
      attestations: write   # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag must match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "$TAG" = "v$v" ] || { echo "::error::Tag $TAG does not match package.json version $v"; exit 1; }

      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          node tools/make-release.js --tag "$TAG"
          (cd dist-release && sha256sum -c SHA256SUMS)

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ## Install or update

          **Windows** (PowerShell): \`irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1 | iex\`
          or download and double-click \`install.cmd\`.

          **macOS / Linux**: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash\`

          Every download is verified with SHA-256. See [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALL.md) for options and how to verify the build provenance.
          EOF
          cat "$RUNNER_TEMP/notes.md"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: LionOrganizer ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist-release/*
          fail_on_unmatched_files: true
          make_latest: true
